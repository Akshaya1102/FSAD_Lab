<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple SSE AI Streaming Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #667eea; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
        .status {
            display: flex; align-items: center; gap: 10px;
            padding: 15px; background: rgba(255,255,255,0.05);
            border-radius: 10px; margin-bottom: 20px;
        }
        .dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: #ef4444;
        }
        .dot.connected { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .chat {
            background: rgba(0,0,0,0.3); border-radius: 15px;
            padding: 20px; height: 400px; overflow-y: auto; margin-bottom: 20px;
        }
        .message {
            margin-bottom: 15px; padding: 12px 16px;
            border-radius: 10px; max-width: 85%; white-space: pre-wrap;
        }
        .user { background: linear-gradient(135deg, #667eea, #764ba2); margin-left: auto; }
        .assistant { background: rgba(255,255,255,0.1); }
        .cursor {
            display: inline-block; width: 8px; height: 18px;
            background: #667eea; animation: blink 0.7s infinite;
            vertical-align: middle; margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .input-area { display: flex; gap: 10px; }
        #input {
            flex: 1; padding: 15px; border: 2px solid #667eea;
            border-radius: 10px; background: #2a2a4e;
            color: #ffffff; font-size: 16px;
        }
        #input:focus { outline: none; background: #3a3a5e; }
        #input::placeholder { color: #888; }
        button {
            padding: 15px 30px; border: none; border-radius: 10px;
            background: #667eea; color: white; font-size: 16px; cursor: pointer;
        }
        button:hover { background: #5a6fd6; }
        .info {
            margin-top: 20px; padding: 15px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 10px; font-size: 14px; color: #888;
        }
        pre { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 5px; overflow-x: auto; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple SSE Streaming Demo</h1>
        <p class="subtitle">Server-Sent Events for AI Streaming</p>

        <div class="status">
            <div class="dot" id="dot"></div>
            <span id="statusText">Connecting...</span>
        </div>

        <div class="chat" id="chat"></div>

        <div class="input-area">
            <input type="text" id="input" placeholder="Type a message here...">
            <button type="button" id="send">Send</button>
        </div>

        <div class="info">
            <strong>How it works:</strong> Browser connects via EventSource, sends messages via POST,
            receives streaming tokens via SSE. Try: "How does this work?" or "Show me code"
        </div>
    </div>

    <script>
        const sessionId = 'sess_' + Math.random().toString(36).substr(2, 9);
        let currentMsg = null;
        let streaming = false;
        let connected = false;

        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const dot = document.getElementById('dot');
        const statusText = document.getElementById('statusText');

        // Focus input on page load
        window.onload = function() {
            input.focus();
            console.log('Page loaded, input focused');
        };

        // Connect to SSE
        try {
            const eventSource = new EventSource('/stream/' + sessionId);

            eventSource.onmessage = function(event) {
                console.log('SSE message:', event.data);
                const data = JSON.parse(event.data);

                if (data.type === 'connected') {
                    dot.classList.add('connected');
                    statusText.textContent = 'Connected';
                    connected = true;
                } else if (data.type === 'start') {
                    streaming = true;
                    currentMsg = addMessage('assistant', '');
                } else if (data.type === 'token') {
                    if (currentMsg) appendToken(currentMsg, data.text);
                } else if (data.type === 'complete') {
                    if (currentMsg) finishMessage(currentMsg);
                    streaming = false;
                    currentMsg = null;
                    input.focus();
                }
            };

            eventSource.onerror = function() {
                console.log('SSE error');
                dot.classList.remove('connected');
                statusText.textContent = 'Reconnecting...';
                connected = false;
            };
        } catch (e) {
            console.error('SSE not supported or error:', e);
            statusText.textContent = 'SSE Error';
        }

        function addMessage(type, text) {
            const div = document.createElement('div');
            div.className = 'message ' + type;
            if (type === 'assistant') {
                div.innerHTML = '<span class="cursor"></span>';
            } else {
                div.textContent = text;
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function appendToken(msgEl, text) {
            const cursor = msgEl.querySelector('.cursor');
            if (cursor) cursor.remove();

            const textNode = document.createTextNode(text);
            msgEl.appendChild(textNode);

            const newCursor = document.createElement('span');
            newCursor.className = 'cursor';
            msgEl.appendChild(newCursor);

            chat.scrollTop = chat.scrollHeight;
        }

        function finishMessage(msgEl) {
            const cursor = msgEl.querySelector('.cursor');
            if (cursor) cursor.remove();
        }

        function send() {
            const text = input.value.trim();
            console.log('Send clicked, text:', text, 'streaming:', streaming, 'connected:', connected);

            if (!text) {
                console.log('Empty text, returning');
                return;
            }
            if (streaming) {
                console.log('Already streaming, returning');
                return;
            }

            addMessage('user', text);
            input.value = '';

            if (!connected) {
                addMessage('assistant', 'Not connected to server. Please make sure the server is running on http://localhost:3000');
                return;
            }

            streaming = true;

            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: sessionId, prompt: text })
            }).catch(function(err) {
                console.error('Fetch error:', err);
                streaming = false;
            });
        }

        sendBtn.addEventListener('click', send);
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                send();
            }
        });

        console.log('Script loaded');
    </script>
</body>
</html>
